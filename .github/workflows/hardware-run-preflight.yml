name: Hardware Qualification Tools CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-tools:
    name: Hardware qualification tool tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Verify Python and validator import
        working-directory: tools
        run: |
          python --version
          python -c "import validate_hardware_qualification_run; print('validator import: PASS')"

      - name: Run hardware qualification tool tests
        run: |
          python -m unittest discover -s tools -p 'test_*.py' -v
          python -m unittest discover -s test -p 'test_*.py' -v
