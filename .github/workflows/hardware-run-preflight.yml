name: Hardware Qualification Tools CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-tools:
    name: Hardware qualification tool tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Run hardware qualification preflight self-tests
        working-directory: tools
        run: python -m unittest test_validate_hardware_qualification_run.py
