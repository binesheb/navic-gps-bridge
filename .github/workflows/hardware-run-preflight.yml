name: Hardware Qualification Tools CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-tools:
    name: Hardware qualification tool tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Verify Python and validator import
        run: |
          python --version
          python -c "from tools.validate_hardware_qualification_run import validate_run; print('validator import: PASS')"

      - name: Run hardware qualification validator tests
        run: python -m unittest discover -s tools -p 'test_validate_hardware_qualification_run.py' -t . -v

      - name: Run serial capture regression tests
        run: python -m unittest discover -s test -p 'test_serial_nmea_capture.py' -t . -v
