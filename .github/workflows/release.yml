name: Release Firmware

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Run NMEA stream checker self-tests
        working-directory: tools
        run: python test_nmea_stream_check.py

      - name: Run embedded regression tests
        run: pio test -e esp32-s3-tests --junit-output-path test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navic-gps-bridge-release-test-results-${{ github.sha }}
          if-no-files-found: warn
          path: test-results.xml

  build-and-release:
    name: Build and publish release
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Build ESP32-S3 firmware
        run: pio run -e esp32-s3-devkitc-1

      - name: Prepare release files
        run: |
          mkdir -p release
          cp .pio/build/esp32-s3-devkitc-1/firmware.bin release/navic-gps-bridge-${{ github.ref_name }}.bin
          cp .pio/build/esp32-s3-devkitc-1/bootloader.bin release/bootloader.bin
          cp .pio/build/esp32-s3-devkitc-1/partitions.bin release/partitions.bin
          {
            echo "NavIC GPS Bridge release manifest"
            echo "tag=${{ github.ref_name }}"
            echo "commit=${{ github.sha }}"
            echo "board=esp32-s3-devkitc-1"
            echo "platformio_environment=esp32-s3-devkitc-1"
            echo "python=$(python --version)"
            echo "platformio=$(pio --version)"
            echo "firmware_bytes=$(stat -c%s release/navic-gps-bridge-${{ github.ref_name }}.bin)"
            echo "build_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release/BUILD-MANIFEST.txt
          sha256sum release/navic-gps-bridge-${{ github.ref_name }}.bin release/bootloader.bin release/partitions.bin release/BUILD-MANIFEST.txt > release/SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*
