name: Release Firmware

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build ESP32-S3 firmware
        run: pio run -e esp32-s3-devkitc-1

      - name: Prepare release files
        run: |
          mkdir -p release
          cp .pio/build/esp32-s3-devkitc-1/firmware.bin release/navic-gps-bridge-${{ github.ref_name }}.bin
          cp .pio/build/esp32-s3-devkitc-1/bootloader.bin release/bootloader.bin || true
          cp .pio/build/esp32-s3-devkitc-1/partitions.bin release/partitions.bin || true
          cat > release/BUILD-MANIFEST.txt <<EOF
          NavIC GPS Bridge release manifest
          tag=${{ github.ref_name }}
          commit=${{ github.sha }}
          board=esp32-s3-devkitc-1
          platformio_environment=esp32-s3-devkitc-1
          build_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*
