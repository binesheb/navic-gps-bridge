name: Firmware Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install PlatformIO
        run: pip install -r requirements-ci.txt

      - name: Run NMEA stream checker self-tests
        working-directory: tools
        run: python test_nmea_stream_check.py

      - name: Compile ESP32-S3 regression suite
        run: pio test -e esp32-s3-tests --without-uploading

      - name: Build production firmware
        run: pio run -e esp32-s3-devkitc-1

      - name: Generate firmware checksum
        run: sha256sum .pio/build/esp32-s3-devkitc-1/firmware.bin > .pio/build/esp32-s3-devkitc-1/SHA256SUMS

      - name: Generate build manifest
        run: |
          {
            echo "repository=binesheb/navic-gps-bridge"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "platformio=$(pio --version)"
            echo "build_target=esp32-s3-devkitc-1"
            echo "firmware_sha256=$(cut -d' ' -f1 .pio/build/esp32-s3-devkitc-1/SHA256SUMS)"
            echo "firmware_bytes=$(stat -c%s .pio/build/esp32-s3-devkitc-1/firmware.bin)"
          } > .pio/build/esp32-s3-devkitc-1/BUILD_INFO.txt

      - name: Report firmware size
        run: pio run -e esp32-s3-devkitc-1 -t size

      - name: Upload production firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: navic-gps-bridge-esp32-s3-firmware
          path: |
            .pio/build/esp32-s3-devkitc-1/firmware.bin
            .pio/build/esp32-s3-devkitc-1/SHA256SUMS
            .pio/build/esp32-s3-devkitc-1/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
