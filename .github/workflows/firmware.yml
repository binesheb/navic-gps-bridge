name: Firmware Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install PlatformIO
        run: pip install -r requirements-ci.txt

      - name: Run ESP32-S3 regression suite
        run: pio test -e esp32-s3-tests

      - name: Build production firmware
        run: pio run -e esp32-s3-devkitc-1

      - name: Upload production firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: navic-gps-bridge-esp32-s3-firmware
          path: .pio/build/esp32-s3-devkitc-1/firmware.bin
          if-no-files-found: error
          retention-days: 14
