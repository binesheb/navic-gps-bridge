name: Firmware CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PlatformIO test build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Run NMEA stream checker self-tests
        working-directory: tools
        run: python test_nmea_stream_check.py

      - name: Run firmware bundle verifier self-tests
        working-directory: tools
        run: python -m unittest test_verify_build_artifact.py

      - name: Run live capture analyzer self-tests
        working-directory: tools
        run: python -m unittest test_analyze_live_capture.py

      - name: Run live health sequence analyzer self-tests
        working-directory: tools
        run: python -m unittest test_analyze_health_sequence.py

      - name: Run live acceptance argument-validation self-tests
        working-directory: tools
        run: python -m unittest test_live_acceptance.py

      - name: Run field evidence collector self-tests
        working-directory: tools
        run: python -m unittest test_collect_field_evidence.py

      - name: Run field evidence verifier self-tests
        working-directory: tools
        run: python -m unittest test_verify_field_evidence.py

      - name: Run field evidence manifest verifier self-tests
        working-directory: tools
        run: python -m unittest test_verify_evidence_manifest.py

      - name: Run field evidence bundle preflight self-tests
        working-directory: tools
        run: python -m unittest test_validate_field_bundle.py

      - name: Run field capture structure self-tests
        working-directory: tools
        run: python -m unittest test_validate_field_capture.py

      - name: Run simultaneous capture quality self-tests
        working-directory: tools
        run: python test_validate_capture_quality.py

      - name: Run field evidence qualification self-tests
        working-directory: tools
        run: python -m unittest test_qualify_field_evidence.py

      - name: Run simultaneous field capture self-tests
        working-directory: tools
        run: python -m unittest test_capture_field_evidence.py

      - name: Run recovery capture qualification self-tests
        working-directory: tools
        run: python -m unittest test_qualify_recovery_capture.py

      - name: Run recovery bundle integrity self-tests
        working-directory: tools
        run: python -m unittest test_qualify_recovery_bundle.py

      - name: Run recovery evidence fingerprint verifier self-tests
        working-directory: tools
        run: python -m unittest test_verify_recovery_report.py

      - name: Run field qualification report self-tests
        working-directory: tools
        run: python -m unittest test_field_qualification_report.py

      - name: Run complete field qualification runner self-tests
        working-directory: tools
        run: python -m unittest test_run_field_qualification.py

      - name: Run hardware qualification finalizer self-tests
        working-directory: tools
        run: python -m unittest test_finalize_hardware_qualification_run.py

      - name: Run hardware port preflight self-tests
        working-directory: tools
        run: python -m unittest test_hardware_port_preflight.py

      - name: Compile embedded regression tests
        run: pio test -e esp32-s3-tests --without-uploading --without-testing --junit-output-path test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: navic-gps-bridge-test-results-${{ github.sha }}
          if-no-files-found: warn
          path: test-results.xml

  build:
    name: Production firmware build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Build production firmware
        run: pio run -e esp32-s3-devkitc-1

      - name: Generate firmware checksums
        run: |
          cd .pio/build/esp32-s3-devkitc-1
          sha256sum firmware.bin bootloader.bin partitions.bin > SHA256SUMS

      - name: Generate build manifest
        run: |
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "python=$(python --version)"
            echo "platformio=$(pio --version)"
            echo "build_target=esp32-s3-devkitc-1"
            echo "firmware_sha256=$(sha256sum .pio/build/esp32-s3-devkitc-1/firmware.bin | cut -d' ' -f1)"
            echo "firmware_bytes=$(stat -c%s .pio/build/esp32-s3-devkitc-1/firmware.bin)"
            echo "bootloader_sha256=$(sha256sum .pio/build/esp32-s3-devkitc-1/bootloader.bin | cut -d' ' -f1)"
            echo "bootloader_bytes=$(stat -c%s .pio/build/esp32-s3-devkitc-1/bootloader.bin)"
            echo "partitions_sha256=$(sha256sum .pio/build/esp32-s3-devkitc-1/partitions.bin | cut -d' ' -f1)"
            echo "partitions_bytes=$(stat -c%s .pio/build/esp32-s3-devkitc-1/partitions.bin)"
          } > .pio/build/esp32-s3-devkitc-1/BUILD_INFO.txt

      - name: Verify firmware bundle integrity
        run: python tools/verify_build_artifact.py .pio/build/esp32-s3-devkitc-1 --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"

      - name: Report firmware size
        run: pio run -e esp32-s3-devkitc-1 -t size | tee firmware-size.txt

      - name: Upload firmware size report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: navic-gps-bridge-size-${{ github.sha }}
          if-no-files-found: error
          path: firmware-size.txt

      - name: Upload firmware build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: navic-gps-bridge-firmware-${{ github.sha }}
          if-no-files-found: error
          path: |
            .pio/build/esp32-s3-devkitc-1/firmware.bin
            .pio/build/esp32-s3-devkitc-1/bootloader.bin
            .pio/build/esp32-s3-devkitc-1/partitions.bin
            .pio/build/esp32-s3-devkitc-1/SHA256SUMS
            .pio/build/esp32-s3-devkitc-1/BUILD_INFO.txt
