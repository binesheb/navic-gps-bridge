[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -D CORE_DEBUG_LEVEL=3
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.4
  throwtheswitch/Unity @ ^2.6.1

[env:esp32-s3-tests]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
test_build_src = yes
test_filter =
  test_event_api
  test_live_diagnostics
  test_event_diagnostics
  test_event_log
  test_nmea_engine
  test_gnss_health
  test_gnss_runtime
build_src_filter =
  +<*>
  -<main.cpp>
build_flags =
  -D CORE_DEBUG_LEVEL=3
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.4
  throwtheswitch/Unity @ ^2.6.1
